name: Detekt

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detekt:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Evaluate library rules
        run: >
          ./gradlew
          :lib:detektJsMainSourceSet
          :lib:detektJsTestSourceSet
          -PtablerDetekt.strict=false
          --no-daemon
          --console=plain
