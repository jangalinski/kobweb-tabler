name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Export documentation site
        run: >
          ./gradlew
          --no-daemon
          --no-watch-fs
          --console=plain
          -PkobwebReuseServer=false
          -PkobwebEnv=DEV
          -PkobwebRunLayout=STATIC
          -PkobwebBuildTarget=RELEASE
          -PkobwebExportLayout=STATIC
          :site:kobwebExport

      - name: Patch Tagessieg basePath for GitHub Pages
        run: >
          sed -i
          's/basePath: "tagessieg"/basePath: "kobweb-tabler\/examples\/tagessieg"/'
          _examples/tagessieg/.kobweb/conf.yaml

      - name: Export Tagessieg example
        run: >
          ./gradlew
          --no-daemon
          --no-watch-fs
          --console=plain
          -PkobwebReuseServer=false
          -PkobwebEnv=DEV
          -PkobwebRunLayout=STATIC
          -PkobwebBuildTarget=RELEASE
          -PkobwebExportLayout=STATIC
          -p _examples
          :tagessieg:kobwebExport

      - name: Assemble Pages artifact
        run: |
          mkdir -p build/gh-pages/examples/tagessieg
          cp -R site/.kobweb/site/. build/gh-pages/
          rsync -a --exclude tagessieg/ _examples/tagessieg/.kobweb/site/ build/gh-pages/examples/tagessieg/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
