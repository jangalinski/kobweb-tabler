<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="20 -169.5 938 938"
  role="img"
  aria-label="Geometric logo"
  style="--dark:#294950; --blue:#087EFF; --light-blue:#2A97FF; --background:#CCCCCC; --radius:360px"
>
  <title>Geometric logo</title>

  <rect
    x="20"
    y="-169.5"
    width="938"
    height="938"
    style="fill:var(--background, #CCCCCC); rx:var(--radius, 360px); ry:var(--radius, 360px)"
  />

  <!-- Rear diamond -->
  <rect
    x="166"
    y="125"
    width="318"
    height="318"
    rx="34"
    ry="34"
    transform="rotate(45 325 284)"
